<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Station Streaming</title>
    <meta
      name="description"
      content="Allow a station to continuously stream video and/or audio to all connected teachers and students. For more information and configuration, see:<br /><a href='https://github.com/edrys-labs/module-streaming' target='_blank'>https://github.com/edrys-labs/module-streaming</a>"
    />
    <meta name="show-in" content="station" />
    <meta 
      name="module-config" 
      content="{
        'stationConfig': {
          'streamName': {
            'type': 'string',
            'hint': 'Unique name for this stream',
          },
          'streamQuality': {
            'type': 'radio-button',
            'options': ['low', 'medium', 'high'],
            'hint': 'Quality of the stream (affects bandwidth usage)',
          },
          'video': {
            'type': boolean,
            'hint': 'if true, the station will stream video',
          },
          'audio': {
            'type': boolean,
            'hint': 'if true, the station will stream audio',
          },
          'mirrorX': {
            'type': boolean,
            'hint': 'Mirror the video horizontally',
          },
          'mirrorY': {
            'type': boolean,
            'hint': 'Mirror the video vertically',
          },
          'rotate': {
            'type': number,
            'hint': 'Rotate the video',
          },
          'streamMethod': {
            'type': radio-button,
            'options': ['webrtc', 'websocket'],
          },
          'websocketUrl': {
            'type': string,
            'hint': 'WebSocket server URL (needed for websocket method)',
          }
        }
      }" 
    />

    <script src="https://edrys-labs.github.io/module/edrys.js"></script>

    <script
      defer
      src="https://edrys-labs.github.io/module/vendor/alpine.min.js"
    ></script>

    <link
      rel="stylesheet"
      href="https://edrys-labs.github.io/module/vendor/water.min.css"
    />
    
    <script src="./script.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="video-container">
      <video id="video" style="width: 100%" autoplay controls></video>
      <div id="loader" class="loader-container">
        <div class="loader"></div>
        <div class="loader-text">Connecting to stream... (This may take a moment)</div>
      </div>
      <button
        onclick="reloadThisStream()"
        title="force reload of this camera stream"
      >
        ⟳
      </button>
      <select id="camera-select" title="Select camera"></select>
      
      <div id="stream-info" class="stream-info">
        <div id="stream-name"></div>
      </div>
    </div>
  </body>
</html>
