<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Station Streaming</title>
    <meta
      name="description"
      content="Allow a station to continuously stream video and/or audio to all connected teachers and students. For more information and configuration, see:<br /><a href='https://github.com/edrys-labs/module-streaming' target='_blank'>https://github.com/edrys-labs/module-streaming</a>"
    />
    <meta name="show-in" content="station" />
    <meta 
      name="module-config" 
      content="{
        'stationConfig': {
          'streamName': {
            'type': 'string',
            'hint': 'Unique name for this stream (default: Camera 1)',
          },
          'streamQuality': {
            'type': 'radio-button',
            'options': ['medium', 'low', 'high'],
            'default': 'medium',
            'hint': 'Quality of the stream (affects bandwidth usage)',
          },
          'video': {
            'type': 'boolean',
            'default': true,
            'hint': 'Stream the camera',
          },
          'audio': {
            'type': 'boolean',
            'default': false,
            'hint': 'Stream the microphone',
          },
          'mirrorX': {
            'type': 'boolean',
            'hint': 'Mirror the video horizontally',
          },
          'mirrorY': {
            'type': 'boolean',
            'hint': 'Mirror the video vertically',
          },
          'rotate': {
            'type': 'number',
            'hint': 'Rotate the video by degrees (0, 90, 180, 270)',
          },
          'streamMethod': {
            'type': 'radio-button',
            'options': ['webrtc', 'websocket'],
            'hint': 'webrtc (default, peer to peer) or websocket (relay, needs websocketUrl)',
          },
          'websocketUrl': {
            'type': 'string',
            'hint': 'WebSocket server URL (needed for websocket method)',
          }
        }
      }" 
    />

    <script src="https://edrys-labs.github.io/module/edrys.js"></script>

    <link
      rel="stylesheet"
      href="https://edrys-labs.github.io/module/vendor/water.min.css"
    />
    <link
      rel="stylesheet"
      href="https://edrys-labs.github.io/module/vendor/open-iconic/css/open-iconic.min.css"
    />

    <script src="./script.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="video-container">
      <!-- muted until the script unmutes it for viewers: the station never plays its own microphone -->
      <video id="video" autoplay muted playsinline controls></video>
      <div id="loader" class="loader-container">
        <div class="loader"></div>
        <div class="loader-text">Connecting to stream... (This may take a moment)</div>
      </div>

      <div class="controls">
        <span id="status" class="badge wait" role="status">connecting</span>
        <button
          id="reload-button"
          type="button"
          title="Reconnect stream"
          aria-label="Reconnect stream"
        >
          <span class="oi" data-glyph="reload" aria-hidden="true"></span>
        </button>
        <select id="camera-select" title="Select camera" aria-label="Camera" hidden></select>
      </div>

      <div id="stream-info" class="stream-info" hidden>
        <span id="stream-name"></span>
        <span class="stream-quality"></span>
      </div>
    </div>
  </body>
</html>
